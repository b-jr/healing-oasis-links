<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>All Is Well Healing Oasis — Links</title>
<meta name="description" content="Intake paperwork and directions for All Is Well Healing Oasis, 19815 Grand Ave, Lake Elsinore, CA 92530.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    /* one warm clay hue, light to dark — hierarchy comes from fill, not from a second color */
    --sand:#F4EDE3;      /* page background */
    --sand-dp:#EBE0D2;   /* background settle at the base */
    --card:#FBF6EF;      /* button text, logo backing */
    --clay:#6B4F3F;      /* buttons, headings */
    --clay-dk:#4F3A2D;   /* button press */
    --ink:#3A2E26;
    --muted:#8A7869;
    --line:#DDCFBF;      /* hairlines */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;color:var(--ink);
    background:radial-gradient(115% 75% at 50% 0%,var(--card) 0%,var(--sand) 52%,var(--sand-dp) 100%) fixed;
    font-family:"Nunito Sans",system-ui,-apple-system,sans-serif;
    display:flex;justify-content:center;padding:48px 22px 60px;
    -webkit-font-smoothing:antialiased;
  }
  main{width:100%;max-width:420px;text-align:center}

  /* logo — put logo.png next to this file, or delete the <img> and keep the wordmark */
  .logo{width:96px;height:96px;border-radius:50%;object-fit:cover;margin:0 auto 20px;display:block;background:var(--card);border:1px solid var(--line)}
  h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:36px;line-height:1.12;color:var(--clay);letter-spacing:.015em}
  h1 em{font-style:italic;font-weight:500}
  .tag{margin:12px auto 0;color:var(--muted);font-size:15px;max-width:30ch;line-height:1.55}

  /* hairline with a small diamond — the one ornamental flourish */
  .ornament{display:flex;align-items:center;justify-content:center;gap:12px;margin:30px 0}
  .ornament::before,.ornament::after{content:"";height:1px;width:56px;background:var(--line)}
  .ornament i{width:6px;height:6px;border:1px solid var(--muted);transform:rotate(45deg)}

  .links{display:flex;flex-direction:column;gap:11px;list-style:none}
  .links a{
    display:flex;align-items:center;justify-content:center;gap:10px;
    border:1px solid var(--clay);border-radius:999px;
    background:transparent;color:var(--clay);text-decoration:none;
    font-weight:600;font-size:15.5px;letter-spacing:.03em;
    padding:15px 18px;
    transition:background .14s ease,color .14s ease;
  }
  .links a:hover{background:rgba(107,79,63,.08)}
  .links a:active{transform:scale(.985)}
  .links a:focus-visible{outline:2px solid var(--clay);outline-offset:3px}
  .links svg{width:19px;height:19px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  /* the one filled button carries the primary action */
  .links a.primary{background:var(--clay);color:var(--card)}
  .links a.primary:hover{background:var(--clay-dk)}

  footer{margin-top:38px;color:var(--muted);font-size:12.5px;letter-spacing:.04em}
  footer a{color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line)}
  @media (prefers-reduced-motion:reduce){.links a{transition:none}.links a:active{transform:none}}
</style>
</head>
<body>
<main>
  <!-- Replace logo.png with your logo file (a square image works best). -->
  <img class="logo" src="logo.png" alt="" onerror="this.style.display='none'">
  <h1>All Is Well<br><em>Healing Oasis</em></h1>
  <p class="tag">Welcome — we're glad you found us.</p>

  <div class="ornament" aria-hidden="true"><i></i></div>

  <!-- ====== EDIT THESE LINKS ====== -->
  <ul class="links">

      <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><path d="M9 12h6M9 16h4"/></svg>
      Intake Paperwork</a></li>

    <li><a href="https://alliswellhealingoasis.com" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18"/></svg>
      Visit Our Website</a></li>

    <li><a href="https://www.google.com/maps/search/?api=1&amp;query=19815%20Grand%20Ave%2C%20Lake%20Elsinore%2C%20CA%2092530" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><path d="M12 22s7-6.5 7-12a7 7 0 0 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>
      Google Maps</a></li>

    <li><a href="https://maps.apple.com/?address=19815%20Grand%20Ave%2C%20Lake%20Elsinore%2C%20CA%2092530" target="_blank" rel="noopener">

</main>
</body>
</html>
