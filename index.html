<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>All Is Well Healing Oasis — Links</title>
<meta name="description" content="Book a session, find us, and follow All Is Well Healing Oasis.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --mist:#E8EEE9;      /* page background */
    --forest:#24433A;    /* buttons, headings */
    --forest-dk:#1A332C; /* button press */
    --gold:#B8955A;      /* small accents */
    --ink:#1F2A26;
    --muted:#5F6E68;
    --card:#FBFCFA;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;background:var(--mist);color:var(--ink);
    font-family:"Nunito Sans",system-ui,-apple-system,sans-serif;
    display:flex;justify-content:center;padding:40px 20px 56px;
    -webkit-font-smoothing:antialiased;
  }
  main{width:100%;max-width:440px;text-align:center}

  /* logo — put logo.png next to this file, or delete the <img> and keep the wordmark */
  .logo{width:104px;height:104px;border-radius:50%;object-fit:cover;margin:0 auto 18px;display:block;background:var(--card);box-shadow:0 2px 12px rgba(36,67,58,.12)}
  h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:34px;line-height:1.1;color:var(--forest);letter-spacing:.01em}
  h1 em{font-style:italic;font-weight:500}
  .tag{margin:10px auto 0;color:var(--muted);font-size:15px;max-width:32ch;line-height:1.5}

  .rule{width:40px;height:2px;background:var(--gold);margin:26px auto 26px;border-radius:1px}

  .links{display:flex;flex-direction:column;gap:12px;list-style:none}
  .links a{
    display:flex;align-items:center;justify-content:center;gap:10px;
    background:var(--forest);color:#fff;text-decoration:none;
    font-weight:600;font-size:16px;letter-spacing:.02em;
    padding:16px 18px;border-radius:999px;
    box-shadow:0 2px 10px rgba(36,67,58,.18);
    transition:transform .12s ease,background .12s ease;
  }
  .links a:hover{background:var(--forest-dk)}
  .links a:active{transform:scale(.985)}
  .links a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
  .links svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .links a.primary{background:var(--gold);color:var(--forest-dk)}
  .links a.primary:hover{background:#A8864C}

  footer{margin-top:34px;color:var(--muted);font-size:13px}
  footer a{color:var(--forest);text-decoration:none;border-bottom:1px solid var(--gold)}
  @media (prefers-reduced-motion:reduce){.links a{transition:none}}
</style>
</head>
<body>
<main>
  <!-- Replace logo.png with your logo file (a square image works best). -->
  <img class="logo" src="logo.png" alt="" onerror="this.style.display='none'">
  <h1>All Is Well<br><em>Healing Oasis</em></h1>
  <p class="tag">Welcome. We're glad you found us — book a session, leave a review, or come see us.</p>

  <div class="rule" aria-hidden="true"></div>

  <!-- ====== EDIT THESE LINKS ====== -->
  <ul class="links">
    <li><a class="primary" href="https://docs.google.com/forms/d/e/1FAIpQLSfHToEZreT4nmhvY3V34bUICEnOzuubsAs7IlrRaVIeoPGfGA/viewform" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      Book a Session</a></li>

    <li><a href="https://alliswellhealingoasis.com" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18"/></svg>
      Visit Our Website</a></li>

    <li><a href="https://instagram.com/YOUR_HANDLE" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".8" fill="currentColor"/></svg>
      Instagram</a></li>

    <li><a href="https://facebook.com/YOUR_PAGE" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><path d="M14 8h3V4h-3a4 4 0 0 0-4 4v3H7v4h3v6h4v-6h3l1-4h-4V8z"/></svg>
      Facebook</a></li>

    <li><a href="https://g.page/r/YOUR_REVIEW_LINK" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/></svg>
      Google Reviews</a></li>

    <li><a href="sms:+15555555555">
      <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      Call / Text</a></li>

    <li><a href="https://maps.google.com/?q=All+Is+Well+Healing+Oasis" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><path d="M12 22s7-6.5 7-12a7 7 0 0 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>
      Directions</a></li>
  </ul>
  <!-- ================================== -->

  <footer><a href="https://alliswellhealingoasis.com">alliswellhealingoasis.com</a></footer>
</main>
</body>
</html>
